[package]
name = "microscpi"
version.workspace = true
authors.workspace = true
edition.workspace = true
description = "A Rust library for creating SCPI interfaces."
readme = "../README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords = ["async", "embedded", "scpi"]
categories = ["embedded", "no-std::no-alloc", "parsing"]

[package.metadata.release]
pre-release-replacements = [
  { file = "../README.md", search = 'microscpi = "[a-z0-9\\.-]+"', replace = 'microscpi = "{{version}}"' },
]

[lib]
name = "microscpi"

[[bench]]
harness = false
name = "basic"
path = "benches/basic.rs"

[dependencies]
bitflags = { version = "2.9.0", optional = true }
defmt = { version = "1", optional = true }
heapless = "0.9"
microscpi-macros.workspace = true

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
tokio = { version = "1.40.0", features = ["macros", "rt", "rt-multi-thread"] }

[features]
default = ["registers"]
defmt = ["dep:defmt"]
registers = ["dep:bitflags"]
std = []
